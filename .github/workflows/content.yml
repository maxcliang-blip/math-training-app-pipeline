name: Content
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_aspect_ratios:
        description: >-
          Bootstrap mode. Compiles every figure with the real toolchain and rewrites each
          figure's declared size(W,H) and asymptoteAspectRatio to the box the compiler
          actually produced, then uploads the rewritten content as an artifact instead of
          asserting on it. Use once when adopting a new TeX Live; never as a gate.
        type: boolean
        default: false

jobs:
  content-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Rendering Conventions S3.3/S9 #11: content cannot reach import unverified, and the
      # gate proves it can fail before it is trusted to block anything.
      - name: Content math gate
        run: npm run content:selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-math-report
          path: artifacts/content-math-report*.json

  figures:
    runs-on: ubuntu-latest
    # Asymptote pulls TeX Live, so this job is minutes not seconds. The ceiling is here to turn
    # a wedged apt or a hung compile into a red run rather than a job that never reports.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Asymptote is a server-side build dependency (Rendering Conventions S5). It is a heavy
      # install because it pulls TeX Live; that is the cost of shipping a figure to a learner
      # without shipping a compiler. Do not make this step skippable: a figure build that
      # validates and compiles nothing is not a pass, and the script exits 3 when the
      # toolchain is absent rather than reporting success.
      #
      # dvisvgm is not optional decoration. apt's asymptote on ubuntu-latest is 2.87, which
      # accepts `-svg`, exits 0, and writes an .eps instead — `-svg` is not an output format on
      # that version. The SVG the manifest hashes is the dvisvgm conversion of that eps, so
      # without dvisvgm the build has no SVG to produce and no honest way to report success.
      - name: Install Asymptote
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends asymptote dvisvgm texlive-latex-base
      # The install step and the build step are deliberately separate, and this one has no
      # `continue-on-error` and no `|| true`. If the package name is wrong, the image lacks
      # TeX Live, or asymptote is installed but cannot start, the failure has to be attributed
      # to the toolchain rather than surfacing later as a mysterious figure error.
      #
      # The binary is discovered the same way scripts/build-figures.mjs discovers it, by asking
      # each candidate for a working --version, because the Debian and Ubuntu packages do not
      # agree on the name (`asymptote` vs `asy`) and hard-coding one of them makes this step
      # fail for a toolchain that is in fact fine. Ubuntu 24.04 installs the `asymptote` package
      # and then has no `asymptote` on PATH, which is exactly how this was found.
      - name: Verify Asymptote toolchain
        run: |
          set -euo pipefail
          ASY=""
          for candidate in "${ASYMPTOTE_BIN:-}" asymptote asy; do
            [ -n "$candidate" ] || continue
            if command -v "$candidate" >/dev/null 2>&1 && "$candidate" --version >/dev/null 2>&1; then
              ASY="$candidate"
              break
            fi
          done
          if [ -z "$ASY" ]; then
            echo "::error::no working Asymptote found (tried ASYMPTOTE_BIN, asymptote, asy)"
            echo "candidates on PATH:"; ls /usr/bin | grep -iE 'asy|asymptote' || echo "  (none)"
            exit 1
          fi
          command -v dvisvgm >/dev/null 2>&1 || {
            echo "::error::dvisvgm is missing; asymptote 2.87 writes EPS, not SVG, and dvisvgm is what turns it into the SVG this pipeline hashes"
            exit 1
          }
          echo "asymptote binary: $ASY"
          "$ASY" --version
          command -v latex   >/dev/null || { echo "::error::latex is missing; every label() in the corpus is typeset by TeX"; exit 1; }
          kpsewhich amsmath.sty >/dev/null 2>&1 || {
            echo "::error::amsmath.sty not found; \\operatorname, \\arg, \\lceil and \\rceil in the corpus are amsmath, and without it TeX dies inside shipout() and every affected figure reports the same opaque 'shipout failed'"
            exit 1
          }
          echo "latex:   $(command -v latex)"
          echo "amsmath: $(kpsewhich amsmath.sty)"
          echo "dvisvgm: $(command -v dvisvgm) ($(dvisvgm --version 2>&1 | head -1))"
      # Prove the compiler can actually do the one thing this pipeline needs of it: turn a
      # size(W,H) source containing a TeX label into an SVG. A --version banner only proves the
      # binary starts, and this corpus's figures are all label("$...$"), so a missing dvipng or
      # a TeX Live without the amsmath fonts would otherwise surface as three corpus errors that
      # look like authoring mistakes. One figure, no corpus, no tolerance.
      #
      # This runs the exact sequence scripts/build-figures.mjs runs, including the two traps:
      # no `-outdir` (2.87 swallows the source filename as a module) and an explicit eps->svg
      # conversion (2.87 ignores `-svg`). Asserting on the svg is the point; asserting on the
      # compiler's exit code is what let the original step stay green while producing nothing.
      - name: Toolchain smoke compile
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cat > "$work/smoke.asy" <<'ASY'
          size(100,50);
          draw((0,0)--(1,0),Arrow);
          label("$x$",(1,0),SE);
          ASY
          ASY=""
          for candidate in "${ASYMPTOTE_BIN:-}" asymptote asy; do
            [ -n "$candidate" ] || continue
            if command -v "$candidate" >/dev/null 2>&1; then ASY="$candidate"; break; fi
          done
          ( cd "$work" && "$ASY" -svg smoke.asy )
          if [ ! -s "$work/smoke.svg" ] && [ -s "$work/smoke.eps" ]; then
            echo "note: compiler wrote eps, converting with dvisvgm (Asymptote $( "$ASY" --version 2>&1 | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1 ) ignores -svg)"
            dvisvgm --eps --no-fonts -o "$work/smoke.svg" "$work/smoke.eps"
          fi
          if [ ! -s "$work/smoke.svg" ]; then
            echo "::error::smoke compile produced no svg; work dir held: $(ls "$work" | tr '\n' ' ')"
            exit 1
          fi
          grep -q "<svg" "$work/smoke.svg"
          echo "smoke svg: $(wc -c < "$work/smoke.svg") bytes, box $(grep -oE 'width=.[0-9.]+. height=.[0-9.]+' "$work/smoke.svg" | head -1)"
          rm -rf "$work"
      - name: Figure build
        if: ${{ !inputs.record_aspect_ratios }}
        run: npm run content:figures
      - name: Record aspect ratios from a real compile
        if: ${{ inputs.record_aspect_ratios && github.event_name == 'workflow_dispatch' }}
        run: npm run content:figures -- --record-aspect-ratios
      # A green figure job has to mean figures were produced. The build exits 0 on a corpus
      # with no figures at all, which is technically true and completely useless, so the
      # manifest is asserted here: at least one figure, and every one of them carrying a hash.
      - name: Assert the manifest is populated
        if: ${{ !inputs.record_aspect_ratios }}
        run: |
          set -euo pipefail
          node -e '
            const m = require("./artifacts/figures/manifest.json");
            if (m.status !== "pass") throw new Error("manifest status is " + m.status);
            if (!m.toolchain) throw new Error("manifest records no toolchain");
            if (!m.figures.length) throw new Error("manifest has no compiled figures");
            for (const f of m.figures) {
              if (!f.figureHash) throw new Error(f.figureKey + " has no figureHash");
              if (!f.figureSvgUrl) throw new Error(f.figureKey + " has no figureSvgUrl");
            }
            console.log("manifest ok:", m.figures.length, "figures,", m.toolchain.version);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figure-manifest
          path: artifacts/figures/manifest.json
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.record_aspect_ratios && github.event_name == 'workflow_dispatch' }}
        with:
          name: recorded-content
          path: content/
