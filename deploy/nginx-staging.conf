server {
  listen 80;
  server_name _;

  root /opt/mta/web/dist;
  index index.html;

  # Compiled figures. These are content-addressed artifacts served straight off disk by the API,
  # so they get the same immutable caching the figure contract asks for, and no gzip: an SVG is
  # already compact and the double decode costs more than it saves.
  location /artifacts/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The built app is a single-page app, so an unknown path is a client-side route, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}